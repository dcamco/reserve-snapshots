<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Reserve — Live Auction Board</title>
<style>
:root { color-scheme: dark; --bg:#111312; --card:#1b1e1c; --ink:#e8e6df; --ink2:#9a988f;
        --line:#2c2f2d; --hot:#4cd67a; --warm:#e0b34c; --acc:#5b9fe0; }
* { box-sizing:border-box; margin:0 }
body { background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px }
h1 { font-size:1.25rem } .sub { color:var(--ink2); font-size:.82rem; margin:4px 0 12px }
.bar { display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; align-items:center }
.bar button, .bar select { background:var(--card); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:.85rem }
.bar button.on { border-color:var(--acc); color:var(--acc) }
#msort { display:none }
.twrap { overflow-x:auto } table { width:100%; border-collapse:collapse }
th { text-align:left; color:var(--ink2); font-size:.72rem; text-transform:uppercase; letter-spacing:.05em;
     padding:8px 10px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; white-space:nowrap }
th.num, td.num { text-align:right } td { padding:9px 10px; border-bottom:1px solid var(--line); font-size:.9rem }
td.cd { font-variant-numeric:tabular-nums; white-space:nowrap; color:var(--ink2) }
td.cd.soon { color:var(--hot); font-weight:600 }
a { color:var(--ink); text-decoration:none } a:active, a:hover { color:var(--acc) }
.nr { background:#2a3d2f; color:var(--hot); font-size:.68rem; padding:1px 6px; border-radius:6px; vertical-align:middle }
.src { color:var(--ink2); font-size:.72rem } .d-hot { color:var(--hot); font-weight:700 } .d-warm { color:var(--warm) }
@media (max-width: 640px) {
  body { padding:12px }
  thead { display:none }
  #msort { display:inline-block }
  table, tbody { display:block }
  tr { display:flex; flex-wrap:wrap; align-items:baseline; gap:2px 10px; padding:10px 2px; border-bottom:1px solid var(--line) }
  td { display:inline; border:none; padding:0; font-size:.92rem }
  td.tt { display:block; width:100%; order:1; font-size:1rem; line-height:1.35 }
  td.cd { order:2; font-weight:600 }
  td.num { text-align:left; order:3 }
  td.num:not(:empty):before { content:attr(data-l) " "; color:var(--ink2); font-size:.78rem }
  td.wc:empty, td.rf:empty, td.dl:empty { display:none }
}
</style></head><body>
<h1>Live Auction Board</h1>
<div class="sub">BaT lots ending within 24h · generated 11/25 15:48 CST · deal% = bid ÷ model ref (hammer-to-hammer, fees excluded) · ★ = ref confidence</div>
<div class="bar">
<button data-f="nr">No reserve</button>
<button data-f="trk">Tracked</button>
<button data-f="deal">Deal reads</button>
<button id="rfsh" title="reload">↻ <span id="age">…</span></button>
<select id="msort">
<option value="end">Sort: ending soonest</option>
<option value="deal">Sort: best deal</option>
<option value="bid">Sort: bid</option>
<option value="t">Sort: name</option>
</select>
</div>
<div class="twrap"><table id="b">
<thead><tr><th data-k="end">Ends</th><th data-k="t">Lot</th><th data-k="bid" class="num">Bid</th>
<th class="num">Ref</th><th data-k="deal" class="num">Deal</th><th class="num">👀</th></tr></thead>
<tbody></tbody></table></div>
<script>
function tick(){var n=Date.now()/1000;document.querySelectorAll('td.cd').forEach(function(c){
var e=+c.dataset.end,s=e-n;if(s<=0){c.textContent='ended';return}
var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);
c.textContent=(h?h+'h ':'')+m+'m'+(h?'':' '+x+'s');c.classList.toggle('soon',s<1800);});}
setInterval(tick,1000);tick();
var tb=document.querySelector('#b tbody');
function srt(k,asc){var rows=[].slice.call(tb.rows);rows.sort(function(a,b){
var va=k==='t'?a.dataset.t:+a.dataset[k],vb=k==='t'?b.dataset.t:+b.dataset[k];
return (va<vb?-1:va>vb?1:0)*(asc?1:-1);});rows.forEach(function(r){tb.appendChild(r)});}
document.querySelectorAll('th[data-k]').forEach(function(th){var asc=true;
th.onclick=function(){srt(th.dataset.k,asc);asc=!asc;};});
document.getElementById('msort').onchange=function(){srt(this.value,true);};
// composable AND-filters: each button toggles; a row must satisfy every active filter
function applyF(){var on=[].slice.call(document.querySelectorAll('.bar button[data-f].on')).map(function(b){return b.dataset.f});
[].slice.call(tb.rows).forEach(function(r){var ok=on.every(function(f){
return (f==='nr'&&r.dataset.nr==='1')||(f==='trk'&&r.dataset.trk==='1')||(f==='deal'&&r.dataset.deal!=='999');});
r.style.display=ok?'':'none';});}
document.querySelectorAll('.bar button[data-f]').forEach(function(btn){btn.onclick=function(){
btn.classList.toggle('on');applyF();};});
// refresh + staleness
var GEN=1795643310;
function age(){var m=Math.round((Date.now()/1000-GEN)/60);
document.getElementById('age').textContent=m<1?'now':m+'m ago';}
setInterval(age,30000);age();
document.getElementById('rfsh').onclick=function(){location.reload(true);};
</script></body></html>
